name: Dev Build

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  dev-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses || true

      - name: Compute dev version string
        id: ver
        run: |
          # Base version from pubspec (no bump on dev branches)
          BASE=$(grep '^version:' pubspec.yaml \
            | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Sanitise branch name for use in tag (replace / and special chars)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          BRANCH=$(echo "$BRANCH" | tr -cd '[:alnum:]-_.')

          DEV_VERSION="${BASE}-dev.${SHORT_SHA}"
          TAG="dev/${BRANCH}"

          echo "dev_version=${DEV_VERSION}"  >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}"      >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}"            >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                  >> $GITHUB_OUTPUT
          echo "Dev build: ${DEV_VERSION} → tag: ${TAG}"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          V="${{ steps.ver.outputs.dev_version }}"
          cp build/app/outputs/flutter-apk/app-debug.apk \
             yokuli-${V}.apk

      # Delete previous pre-release for this branch (keep only latest)
      - name: Delete previous pre-release for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Delete release if it exists (ignore errors)
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Delete the tag locally and remotely (ignore errors)
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

      - name: Create & push dev tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Dev · ${{ steps.ver.outputs.branch }} · ${{ steps.ver.outputs.short_sha }}"
          body: |
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Version:** `${{ steps.ver.outputs.dev_version }}`

            > ⚠️ Development build — not for production use.
            > Enable "Install from unknown sources" on Android to install.
          prerelease: true
          make_latest: false
          files: |
            yokuli-${{ steps.ver.outputs.dev_version }}.apk
