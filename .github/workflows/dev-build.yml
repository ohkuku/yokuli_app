name: Dev Build

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

permissions:
  contents: write
  pages: write        # needed for GitHub Pages deployment
  id-token: write     # needed for GitHub Pages OIDC

# Serialise gh-pages deployments so concurrent branch pushes don't conflict
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  dev-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT"   > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >> android/local.properties

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version=8.11.1 --distribution-type=all

      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses || true

      - name: Compute dev version string
        id: ver
        run: |
          # Base version from pubspec (no bump on dev branches)
          BASE=$(grep '^version:' pubspec.yaml \
            | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Sanitise branch name for use in tag (replace / and special chars)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          BRANCH=$(echo "$BRANCH" | tr -cd '[:alnum:]-_.')

          DEV_VERSION="${BASE}-dev.${SHORT_SHA}"
          TAG="dev/${BRANCH}"
          PREVIEW_URL="https://ohkuku.github.io/yokuli_app/preview/${BRANCH}/"

          echo "dev_version=${DEV_VERSION}"  >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}"      >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}"            >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                  >> $GITHUB_OUTPUT
          echo "preview_url=${PREVIEW_URL}"  >> $GITHUB_OUTPUT
          echo "Dev build: ${DEV_VERSION} → tag: ${TAG}"
          echo "Web preview: ${PREVIEW_URL}"

      - name: Flutter pub get
        run: flutter pub get

      # ── Android ────────────────────────────────────────────────────────

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          V="${{ steps.ver.outputs.dev_version }}"
          cp build/app/outputs/flutter-apk/app-debug.apk \
             yokuli-${V}.apk

      # ── Web preview ────────────────────────────────────────────────────

      - name: Build Web preview
        run: |
          flutter config --enable-web
          BRANCH="${{ steps.ver.outputs.branch }}"
          # base-href must match the GitHub Pages subdirectory
          flutter build web --release --base-href "/yokuli_app/preview/${BRANCH}/"

      - name: Cache-bust web assets
        run: |
          SHA="${{ steps.ver.outputs.short_sha }}"
          # Append ?v=SHA to bootstrap and service-worker references in index.html
          # so browsers always fetch fresh JS even when index.html is CDN-cached.
          sed -i "s/flutter_bootstrap\.js\b/flutter_bootstrap.js?v=${SHA}/g" build/web/index.html
          sed -i "s/flutter_service_worker\.js\b/flutter_service_worker.js?v=${SHA}/g" build/web/index.html

      - name: Deploy web preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          destination_dir: docs/preview/${{ steps.ver.outputs.branch }}
          keep_files: true   # preserve other branches' previews

      # ── GitHub Release ─────────────────────────────────────────────────

      # Delete previous pre-release for this branch (keep only latest)
      - name: Delete previous pre-release for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true

      - name: Create & push dev tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Dev · ${{ steps.ver.outputs.branch }} · ${{ steps.ver.outputs.short_sha }}"
          body: |
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Version:** `${{ steps.ver.outputs.dev_version }}`

            ### 🌐 Web Preview
            **[${{ steps.ver.outputs.preview_url }}](${{ steps.ver.outputs.preview_url }})**
            *(available ~1 min after this release, once Pages deploys)*

            ### 📱 Android
            Install the APK below (enable "Install from unknown sources").

            > ⚠️ Development build — not for production use.
          prerelease: true
          make_latest: false
          files: |
            yokuli-${{ steps.ver.outputs.dev_version }}.apk
