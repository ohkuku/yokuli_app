name: Dev Build

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

permissions:
  contents: write
  pages: write        # needed for GitHub Pages deployment
  id-token: write     # needed for GitHub Pages OIDC

# Serialise gh-pages deployments so concurrent branch pushes don't conflict
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  dev-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT"   > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >> android/local.properties

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version=8.11.1 --distribution-type=all

      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses || true

      - name: Compute dev version string
        id: ver
        run: |
          # Base version from pubspec (no bump on dev branches)
          BASE=$(grep '^version:' pubspec.yaml \
            | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Sanitise branch name for use in tag (replace / and special chars)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          BRANCH=$(echo "$BRANCH" | tr -cd '[:alnum:]-_.')

          DEV_VERSION="${BASE}-dev.${SHORT_SHA}"
          TAG="dev/${BRANCH}"
          # Unique path per commit — no CDN/browser cache collisions
          PREVIEW_URL="https://ohkuku.github.io/yokuli_app/preview/${BRANCH}/${SHORT_SHA}/"

          echo "dev_version=${DEV_VERSION}"  >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}"      >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}"            >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                  >> $GITHUB_OUTPUT
          echo "preview_url=${PREVIEW_URL}"  >> $GITHUB_OUTPUT
          echo "Dev build: ${DEV_VERSION} → tag: ${TAG}"
          echo "Web preview: ${PREVIEW_URL}"

      - name: Flutter pub get
        run: flutter pub get

      # ── Android ────────────────────────────────────────────────────────

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          V="${{ steps.ver.outputs.dev_version }}"
          cp build/app/outputs/flutter-apk/app-debug.apk \
             yokuli-${V}.apk

      # ── Web preview ────────────────────────────────────────────────────

      - name: Build Web preview
        run: |
          flutter config --enable-web
          BRANCH="${{ steps.ver.outputs.branch }}"
          SHA="${{ steps.ver.outputs.short_sha }}"
          # base-href matches the unique per-commit GitHub Pages subdirectory
          flutter build web --release \
            --base-href "/yokuli_app/preview/${BRANCH}/${SHA}/"

      - name: Deploy web preview to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.ver.outputs.branch }}"
          SHA="${{ steps.ver.outputs.short_sha }}"
          DEST="preview/${BRANCH}/${SHA}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use token-authenticated remote for push
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Check out gh-pages branch into a worktree (create orphan if first run)
          if git fetch origin gh-pages; then
            git worktree add /tmp/gh-pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages
          fi

          # ── Clean: remove ALL previous SHA subdirs for this branch ──
          rm -rf "/tmp/gh-pages/preview/${BRANCH}"

          # ── Deploy: copy fresh build into the new unique path ──
          mkdir -p "/tmp/gh-pages/${DEST}"
          cp -r build/web/. "/tmp/gh-pages/${DEST}/"

          # Ensure GitHub Pages doesn't run Jekyll
          touch /tmp/gh-pages/.nojekyll

          # Commit and push (skip if nothing changed)
          cd /tmp/gh-pages
          git add -A
          git diff --cached --quiet || \
            git commit -m "preview: ${BRANCH}/${SHA}"
          git push origin HEAD:gh-pages

      # ── GitHub Release ─────────────────────────────────────────────────

      # Delete previous pre-release for this branch (keep only latest)
      - name: Delete previous pre-release for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true

      - name: Create & push dev tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Dev · ${{ steps.ver.outputs.branch }} · ${{ steps.ver.outputs.short_sha }}"
          body: |
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Version:** `${{ steps.ver.outputs.dev_version }}`

            ### 🌐 Web Preview
            **[${{ steps.ver.outputs.preview_url }}](${{ steps.ver.outputs.preview_url }})**
            *(available ~1 min after this release, once Pages deploys)*

            ### 📱 Android
            Install the APK below (enable "Install from unknown sources").

            > ⚠️ Development build — not for production use.
          prerelease: true
          make_latest: false
          files: |
            yokuli-${{ steps.ver.outputs.dev_version }}.apk
